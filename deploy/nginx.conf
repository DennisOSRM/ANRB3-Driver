# The map at /radar/ on an existing server. Include this inside a `server`
# block, for instance with `include snippets/anrb.conf;`. The bridge listens
# on 127.0.0.1:8088, as deploy/compose.yml publishes it. It uses 8088 rather
# than the bridge's default 8080 to avoid a common port clash.
#
# The page asks for everything relative to where it was served from, so the
# prefix can be changed here alone; the WebSocket is the one location that
# needs the upgrade headers.

location = /radar {
    return 301 /radar/;
}

location /radar/ws {
    proxy_pass http://127.0.0.1:8088/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # The socket sends an update a second and is otherwise quiet; an hour is
    # far longer than any gap in it.
    proxy_read_timeout 1h;
    proxy_buffering off;
}

location /radar/ {
    proxy_pass http://127.0.0.1:8088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
}
