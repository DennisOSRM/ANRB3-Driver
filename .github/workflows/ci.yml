name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Every other job waits for this one.
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # The page's HTML, JavaScript and CSS, with the Prettier version pinned
      # in package-lock.json.
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check

  clippy:
    name: Clippy (${{ matrix.name }})
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            args: --workspace --all-targets
          - name: no default features
            args: -p anrb --all-targets --no-default-features
          - name: profiling
            args: -p anrb --all-targets --features profile_fine
          # The NEON kernels only compile for aarch64. The driver without the
          # usb feature has no C dependencies, so it cross-checks without a
          # cross compiler.
          - name: aarch64
            args: -p anrb --all-targets --no-default-features --target aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}
      - run: cargo clippy ${{ matrix.args }} -- -D warnings

  docs:
    name: Docs
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
      - run: cargo doc --workspace --no-deps --document-private-items

  test:
    name: Tests
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p anrb --no-default-features
      # Force the portable kernels, so both backends run on this machine.
      - run: cargo test -p anrb --lib
        env:
          ANRB_BACKEND: scalar

  msrv:
    name: Minimum Rust version
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  web:
    name: Map page
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: node --check bridge/web/tracks.js
      - run: node --check bridge/web/countries.js
      - run: npm test

  coverage:
    name: Coverage
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --fail-under-lines 90
